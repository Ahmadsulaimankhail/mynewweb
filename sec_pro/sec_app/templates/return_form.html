{% extends "home.html" %}
{% block main %}

<div class="container">
    <div class="form_head">
        <div class="form_title">
            <h2>Return Book</h2>
            <p>Return a borrowed book and update its quantity in the library.</p>
        </div>
        <i class="bi bi-arrow-return-left"></i>
    </div>

    <form method="Post" class="form">
        {% csrf_token %}
        <div class="input_box">
            <div class="input_icon"> <i class="bi bi-hash"></i></div>
            <input type="text" name="bookid" value="{{ book.id }}" placeholder="Enter Book ID">
        </div>

        <div class="input_box">
            <div class="input_icon"><i class="bi bi-stack"></i></div>
            <input type="text" name="quantity" value="{{ book.quant }}" placeholder="Enter Quantity">
        </div>
        <div class="button-box">
            <div class="button-icon"><i class="bi bi-send-check-fill"></i></div>
            <button type="submit">Submit</button>
        </div>

</div>
{% endblock %}
